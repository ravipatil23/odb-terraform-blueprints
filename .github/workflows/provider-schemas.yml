name: Track Provider Schemas

# Spots provider releases that add, change, deprecate or remove arguments on the
# resources the blueprints use (and on whole Oracle families such as aws_odb_*,
# so brand-new resources show up too). Validation alone cannot catch this: a new
# optional argument never fails `terraform validate`, the blueprints just quietly
# fall behind.
#
# Each run regenerates .github/provider-schemas/*.txt against the latest
# providers. If anything changed, it opens (or refreshes) one pull request whose
# diff is the list of changes. Merging it records that the change was reviewed;
# exposing a new argument in a blueprint is a separate, normal pull request.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC, after the validate run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    name: Snapshot provider schemas
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Regenerate snapshots against the latest providers
        id: snapshot
        run: |
          python3 .github/scripts/provider_schemas.py | tee versions.txt
          {
            echo "versions<<EOF"
            sed 's/^\(.*\)=\(.*\)$/| `\1` | `\2` |/' versions.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          rm versions.txt

      - name: Summarise the change
        id: summary
        run: |
          {
            echo "stat<<EOF"
            git diff --stat -- .github/provider-schemas
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/provider-schemas
          delete-branch: true
          add-paths: .github/provider-schemas/*.txt
          commit-message: "chore(providers): refresh provider schema snapshots"
          title: "Provider schema changes for the Oracle Database@ resources"
          labels: provider-schemas
          body: |
            A provider release changed the schema of resources these blueprints use
            or watch. Review the diff, then decide whether any blueprint should
            change:

            - **`+` new argument / resource** — consider exposing it as a variable.
            - **`DEPRECATED`** — plan a migration before it is removed.
            - **`REMOVED` / `required` added** — a blueprint will break; fix it now.

            | Provider | Latest |
            |---|---|
            ${{ steps.snapshot.outputs.versions }}

            ```
            ${{ steps.summary.outputs.stat }}
            ```

            Merge to accept these as the new baseline. Generated by
            `.github/workflows/provider-schemas.yml`.

  report:
    name: Open issue on failure
    needs: snapshot
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create provider-drift --color D93F0B \
            --description "A provider release broke a blueprint" 2>/dev/null || true
          body="The provider schema snapshot job failed: $RUN_URL"
          existing=$(gh issue list --label provider-drift --state open \
            --search "in:title snapshot" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Provider schema snapshot job failed" \
              --label provider-drift --body "$body"
          fi

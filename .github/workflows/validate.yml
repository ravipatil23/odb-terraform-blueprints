name: Validate Terraform Blueprints

# Keeps the reusable Oracle Database@Cloud blueprints formatted and valid as they
# evolve. Every blueprint is a root module, so each is validated on its own.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    name: terraform fmt -check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Check formatting (recursive)
        run: terraform fmt -check -recursive .

  validate:
    name: terraform validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - db-at-aws
          - db-at-azure
          - db-at-gcp
          - azure-network-anchor
          - azure-resource-anchor
          - oci-database
          - multi-az-dataguard
          - cross-region-dataguard
          - azure-dns-hub
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      # No cloud credentials needed: -backend=false skips state, and validate only
      # needs the providers, which init downloads from the registry.
      - name: terraform init
        run: terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform validate -no-color
